name: Test deploy with invalid source path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run IIS Deploy action with non-existent source path (expected to fail)
        id: deploy
        uses: .
        with:
          website-name: "TestWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/nonexistent-deploy-src-12345"
          skip-extra-files: false
        continue-on-error: true

      - name: Assert action failed due to missing source path or connection error
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail - either because the path doesn't exist
          # or because there is no real IIS/MSDeploy server to connect to
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with non-existent source path or no IIS server"
          else
            echo "FAIL: expected failure outcome but got: $OUTCOME"
            exit 1
          fi
