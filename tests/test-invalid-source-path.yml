name: Test IIS Deploy with invalid source path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        name: Invoke IIS Deploy action with invalid source path (expected to fail)
        uses: .
        continue-on-error: true
        with:
          website-name: "TestWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: ""

      - name: Assert action failed due to invalid source path
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty source-path, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty source-path"
