name: Test with invalid source path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a non-existent source path
        id: action
        uses: .
        with:
          website-name: "MyWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/this-path-does-not-exist-at-all-12345"
          skip-extra-files: "false"
        continue-on-error: true

      - name: Assert action failed due to invalid source path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the source path does not exist.
          # The PowerShell ValidateScript checks the path validity.
          # We expect 'failure', not 'success' or 'skipped'.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with non-existent source path"
            exit 1
          fi
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action correctly failed with non-existent source path (outcome=$OUTCOME)"
