name: Test basic deploy attempt (expected connection failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory for deployment
        run: |
          mkdir -p /tmp/deploy-src
          echo "<html><body>Hello World</body></html>" > /tmp/deploy-src/index.html

      - name: Run IIS Deploy action (expected to fail - no real IIS server)
        id: deploy
        uses: .
        with:
          website-name: "TestWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/deploy-src"
          skip-extra-files: false
        continue-on-error: true

      - name: Assert action ran and failed with connection error (no real IIS server)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no real IIS/MSDeploy server
          # This confirms the action correctly attempted to connect
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no IIS server is available"
          else
            echo "FAIL: expected failure outcome but got: $OUTCOME"
            exit 1
          fi
