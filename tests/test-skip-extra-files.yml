name: Test IIS deploy with skip-extra-files enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory
        run: mkdir -p /tmp/test-source-skip && echo "<html>Hello</html>" > /tmp/test-source-skip/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          website-name: "TestWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/test-source-skip"
          skip-extra-files: "true"

      - name: Assert action ran with skip-extra-files=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no real MSDeploy server,
          # but it must NOT be skipped — it must have been invoked
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with skip-extra-files=true (outcome=$OUTCOME)"
