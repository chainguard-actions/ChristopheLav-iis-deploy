name: Test IIS deploy with skip-extra-files enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory
        run: mkdir -p /tmp/test-source-skip && echo "<html>test</html>" > /tmp/test-source-skip/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          website-name: "TestWebsite"
          msdeploy-service-url: "https://fake-msdeploy.example.com:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/test-source-skip"
          skip-extra-files: "true"

      - name: Assert action failed due to MSDeploy connection (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because there is no real MSDeploy service,
          # not because of invalid inputs. skip-extra-files=true is a valid value.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real MSDeploy service available)"
            exit 1
          fi
          echo "PASS: action failed as expected (no real MSDeploy service), skip-extra-files=true was accepted"
