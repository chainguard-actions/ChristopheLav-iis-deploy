name: Test basic invocation with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory for deployment
        run: |
          mkdir -p /tmp/deploy-source
          echo "<html><body>Hello</body></html>" > /tmp/deploy-source/index.html

      - name: Run action (expected to fail at MSDeploy connection, not at input validation)
        id: action
        uses: .
        with:
          website-name: "MyWebsite"
          msdeploy-service-url: "https://localhost:8172/msdeploy.axd"
          msdeploy-username: "testuser"
          msdeploy-password: "testpassword"
          source-path: "/tmp/deploy-source"
          skip-extra-files: "false"
        continue-on-error: true

      - name: Assert action was invoked and failed at MSDeploy (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no real MSDeploy server,
          # but it should NOT fail due to missing/invalid inputs.
          # We accept either 'failure' (MSDeploy connection error) or 'success'
          # (unlikely in test env but valid). We only reject 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
