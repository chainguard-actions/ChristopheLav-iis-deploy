name: 'IIS Deploy'
description: 'Allows to deploy a website on IIS'
inputs:
  website-name:
    description: "IIS website name"
    required: true
  msdeploy-service-url:
    description: "MS Deploy Service URL"
    required: true
  msdeploy-username:
    description: "Username used by Basic authentication to the MS Deploy Service"
    required: true
  msdeploy-password:
    description: "Password used by Basic authentication to the MS Deploy Service"
    required: true
  source-path:
    description: "The path to the source directory that will be deployed"
    required: true
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Deploy Application on IIS
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_PATH: ${{ inputs.source-path }}
        MSDEPLOY_SERVICE_URL: ${{ inputs.msdeploy-service-url }}
        WEBSITE_NAME: ${{ inputs.website-name }}
        MSDEPLOY_USERNAME: ${{ inputs.msdeploy-username }}
        MSDEPLOY_PASSWORD: ${{ inputs.msdeploy-password }}
      run: |
        & "$Env:ACTION_PATH/scripts/PublishAspNet5Website.ps1" `
          "$Env:SOURCE_PATH" `
          "$Env:MSDEPLOY_SERVICE_URL" `
          "$Env:WEBSITE_NAME" `
          "$Env:MSDEPLOY_USERNAME" `
          "$Env:MSDEPLOY_PASSWORD"
branding:
  icon: upload-cloud
  color: purple
